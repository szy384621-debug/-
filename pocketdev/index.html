<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PocketDev - 手机全栈开发平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 移动端底部面板切换栏 -->
<nav class="mobile-nav">
  <button class="mnav-btn active" data-panel="chat">💬 对话</button>
  <button class="mnav-btn" data-panel="editor">📝 代码</button>
  <button class="mnav-btn" data-panel="assistant">🤖 AI 助手</button>
</nav>

<div class="app">

  <!-- ========== 左栏：对话开发 ========== -->
  <section class="panel panel-chat" id="panel-chat">
    <header class="panel-header">
      <button class="icon-btn" title="返回">←</button>
      <div class="header-title">
        <h1>对话开发</h1>
        <p>端侧 AI · 本地离线优先</p>
      </div>
      <button class="icon-btn" title="更多">⋮</button>
    </header>

    <div class="chat-body" id="chatBody">
      <div class="welcome" id="welcome">
        <h2 class="logo">PocketDev</h2>
        <p class="slogan">在手机上写代码、预览、打包 APK</p>
        <div class="try-say">
          <p class="try-title">试着说：</p>
          <button class="try-item" data-prompt="做一个带登录和首页的商城">「做一个带登录和首页的商城」</button>
          <button class="try-item" data-prompt="帮我做一个番茄钟">「帮我做一个番茄钟」</button>
        </div>
      </div>
    </div>

    <footer class="chat-input-bar">
      <button class="round-btn" title="文本设置">Aa</button>
      <button class="round-btn" title="图片">🖼️</button>
      <button class="round-btn" title="搜索">🔍</button>
      <input type="text" id="chatInput" placeholder="描述你想做…" autocomplete="off">
      <button class="send-btn" id="chatSend" title="发送">➤</button>
    </footer>
  </section>

  <!-- ========== 中栏：代码 / 预览 ========== -->
  <section class="panel panel-editor" id="panel-editor">
    <header class="panel-header">
      <div class="header-title file-title">
        <h1 id="currentFileName">index.html</h1>
        <p class="save-state" id="saveState">✓ 已保存</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnRefresh" title="刷新预览">↻</button>
        <button class="icon-btn" id="btnUndo" title="撤销">↺</button>
        <button class="check-btn" id="btnSave" title="保存">✓</button>
        <button class="icon-btn" title="更多">⋮</button>
      </div>
    </header>

    <div class="editor-toolbar">
      <div class="view-toggle">
        <button class="toggle-btn active" id="tabCode">✓ 代码</button>
        <button class="toggle-btn" id="tabPreview">预览</button>
      </div>
      <div class="device-btns">
        <button class="icon-btn device active" data-device="phone" title="手机">📱</button>
        <button class="icon-btn device" data-device="fold" title="折叠屏">↔️</button>
        <button class="icon-btn device" data-device="desktop" title="桌面">🖥️</button>
      </div>
      <span class="engine-tag">当前引擎：端侧 AI · GPU Vulkan</span>
    </div>

    <div class="file-tabs" id="fileTabs"></div>

    <div class="editor-body">
      <div class="code-wrap" id="codeWrap">
        <div class="line-nums" id="lineNums">1</div>
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>
      <div class="preview-wrap hidden" id="previewWrap">
        <iframe id="previewFrame" class="preview-phone" sandbox="allow-scripts"></iframe>
      </div>
    </div>
  </section>

  <!-- ========== 右栏：AI 助手 ========== -->
  <section class="panel panel-assistant" id="panel-assistant">
    <header class="panel-header">
      <button class="icon-btn" title="菜单">☰</button>
      <div class="header-title">
        <h1>AI 助手</h1>
        <p><span id="tokenCount">0</span> tokens · 打包 <span id="buildCount">4</span> 次 · 已省 <span id="savedCount">0</span></p>
      </div>
      <button class="icon-btn" title="更多">⋮</button>
    </header>

    <div class="assistant-body">
      <div class="ai-hint">
        <span class="wrench">🔧</span>
        <p>在左侧提出需求，AI 的回答与说明会展示在这里</p>
      </div>
      <div class="ai-messages" id="aiMessages"></div>

      <div class="card">
        <div class="card-row">
          <div class="card-text">
            <h3>🌲 永久工作树</h3>
            <p>打开开关，把项目永久落到手机存储的真实目录</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="workTreeSwitch">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="card-row">
          <div class="card-text">
            <h3>🧠 本地知识层</h3>
            <p class="card-meta">记忆 <span id="memCount">0</span> · 索引 <span id="indexCount">1</span></p>
          </div>
        </div>
        <button class="outline-btn" id="memBtn">管理长期记忆 / 文件索引</button>
      </div>

      <div class="card build-card" id="buildCard">
        <div class="card-row">
          <div class="card-text">
            <h3>🔧 打包 APK · <span id="buildState">待启动</span></h3>
            <p id="buildDesc">将当前项目打包成可安装的 Android 应用</p>
          </div>
        </div>
        <div class="progress hidden" id="buildProgress"><div class="progress-inner" id="buildInner"></div></div>
      </div>
    </div>

    <footer class="chat-input-bar">
      <input type="text" id="aiInput" placeholder="粘贴报错或追问 AI…" autocomplete="off">
      <button class="send-btn" id="aiSend" title="发送">➤</button>
    </footer>
  </section>

</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
