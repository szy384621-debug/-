<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="贪吃蛇">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3460">
<meta name="format-detection" content="telephone=no">
<title>贪吃蛇</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f3460 100%);
    color: #e6e6e6;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    width: 100%;
    max-width: 560px;
    padding: 14px 18px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title {
    font-size: 1.35rem;
    font-weight: 700;
    background: linear-gradient(90deg, #4ade80, #22d3ee, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .stats { display: flex; gap: 8px; }
  .chip {
    font-size: 0.75rem;
    padding: 5px 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    white-space: nowrap;
  }
  .chip b { color: #4ade80; }

  .stage {
    flex: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    min-height: 0;
  }
  .wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #0a0e1a;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,14,26,0.9);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    transition: opacity 0.25s;
  }
  .overlay h2 {
    font-size: 1.6rem;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .over h2 { background: linear-gradient(90deg, #f87171, #fbbf24); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .overlay p { color: #94a3b8; font-size: 0.85rem; line-height: 1.7; }
  .final { color: #4ade80; font-size: 1.1rem; font-weight: 600; }
  button.btn {
    padding: 12px 34px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    color: #0a0e1a;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 6px 20px rgba(74,222,128,0.35);
    cursor: pointer;
  }
  .hidden { opacity: 0; pointer-events: none; }

  .controls {
    width: 100%;
    max-width: 560px;
    padding: 10px 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .dpad {
    position: relative;
    width: 150px;
    height: 150px;
    flex: 0 0 auto;
  }
  .dpad button {
    position: absolute;
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e6e6e6;
    font-size: 1.3rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .dpad button:active { background: rgba(74,222,128,0.35); }
  .dpad .up    { top: 0; left: 50px; }
  .dpad .left  { top: 50px; left: 0; }
  .dpad .right { top: 50px; left: 100px; }
  .dpad .down  { top: 100px; left: 50px; }
  .dpad .center { top: 50px; left: 50px; width: 50px; height: 50px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.08); }

  .side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    flex: 1;
  }
  .action {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e6e6e6;
    font-size: 0.95rem;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .action:active { background: rgba(74,222,128,0.25); }
  .tip { font-size: 0.72rem; color: #64748b; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <div class="title">贪 吃 蛇</div>
    <div class="stats">
      <span class="chip">分 <b id="score">0</b></span>
      <span class="chip">最高 <b id="best">0</b></span>
    </div>
  </header>

  <div class="stage">
    <div class="wrap">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <h2>准备好了吗？</h2>
        <p>滑动屏幕或点击方向键控制<br>吃到食物得分，撞墙或自身结束</p>
        <button class="btn" id="startBtn">开 始 游 戏</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" id="dpad">
      <button class="up"    data-dir="up">▲</button>
      <button class="left"  data-dir="left">◀</button>
      <span class="center"></span>
      <button class="right" data-dir="right">▶</button>
      <button class="down"  data-dir="down">▼</button>
    </div>
    <div class="side">
      <button class="action" id="pauseBtn">暂 停</button>
      <div class="tip">滑动画面 / 点击方向键<br>空格键暂停</div>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const dpad = document.getElementById('dpad');

  const COLS = 20, ROWS = 20;
  let CELL = 20, viewSize = 400;

  // 游戏状态
  let snake, dir, nextDir, food, score, best, running, paused, timer, currentInterval;
  // 渲染状态
  let particles = [], trail = [], stars = [], shake = 0, deathFlash = 0;
  let lastStepAt = 0, prevHead = null;

  best = +localStorage.getItem('snake_best') || 0;
  bestEl.textContent = best;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    viewSize = Math.max(1, Math.floor(Math.min(rect.width, rect.height)));
    canvas.width = viewSize * dpr;
    canvas.height = viewSize * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CELL = viewSize / COLS;
  }

  function init() {
    snake = [
      { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    particles = [];
    trail = [];
    shake = 0;
    deathFlash = 0;
    prevHead = { x: snake[0].x, y: snake[0].y };
    scoreEl.textContent = 0;
    placeFood();
    initStars();
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 28; i++) {
      stars.push({
        x: Math.random() * viewSize,
        y: Math.random() * viewSize,
        r: 0.4 + Math.random() * 1.1,
        a: 0.1 + Math.random() * 0.35,
        tw: Math.random() * Math.PI * 2,
        sp: 0.01 + Math.random() * 0.02
      });
    }
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function step() {
    if (paused || !running) return;
    dir = nextDir;
    prevHead = { x: snake[0].x, y: snake[0].y };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnEatParticles(food.x, food.y);
      shake = 5;
      placeFood();
    } else {
      const tail = snake.pop();
      // 尾部拖尾粒子
      if (Math.random() < 0.6) {
        trail.push({
          x: tail.x * CELL + CELL / 2,
          y: tail.y * CELL + CELL / 2,
          life: 1
        });
      }
    }
    lastStepAt = performance.now();
  }

  function spawnEatParticles(gx, gy) {
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2;
    const colors = ['#fbbf24', '#fde68a', '#f59e0b', '#4ade80', '#22d3ee'];
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random() * 4;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        size: 2 + Math.random() * 3,
        color: colors[(Math.random() * colors.length) | 0],
        spark: Math.random() < 0.3
      });
    }
    // 环形冲击
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * 2.5,
        vy: Math.sin(a) * 2.5,
        life: 0.7,
        size: 1.8,
        color: '#fde68a',
        spark: true
      });
    }
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    shake = 14;
    deathFlash = 1;
    // 死亡爆裂粒子
    const h = snake[0];
    const cx = h.x * CELL + CELL / 2;
    const cy = h.y * CELL + CELL / 2;
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 5;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        size: 2 + Math.random() * 3,
        color: ['#f87171', '#fbbf24', '#4ade80'][(Math.random() * 3) | 0],
        spark: true
      });
    }
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    // 延迟显示结束面板，让死亡动画播完
    setTimeout(function () {
      overlay.classList.add('over');
      overlay.classList.remove('hidden');
      overlay.innerHTML =
        '<h2>游戏结束</h2>' +
        '<p class="final">本局得分 ' + score + '</p>' +
        '<p>最高分 ' + best + '</p>' +
        '<button class="btn" id="restartBtn">再 来 一 局</button>';
      document.getElementById('restartBtn').addEventListener('click', start);
    }, 650);
  }

  // ===== 渲染 =====
  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawBackground(t) {
    // 底色 + 暗角径向
    ctx.fillStyle = '#070b16';
    ctx.fillRect(0, 0, viewSize, viewSize);
    const vg = ctx.createRadialGradient(viewSize / 2, viewSize / 2, viewSize * 0.15, viewSize / 2, viewSize / 2, viewSize * 0.75);
    vg.addColorStop(0, 'rgba(30, 41, 59, 0.5)');
    vg.addColorStop(1, 'rgba(2, 6, 23, 0.85)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, viewSize, viewSize);

    // 星点（呼吸闪烁）
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.tw += s.sp;
      const a = s.a + Math.sin(s.tw) * 0.18;
      ctx.fillStyle = 'rgba(148, 163, 184, ' + Math.max(0, a) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 网格（呼吸亮度）
    const galpha = 0.035 + Math.sin(t * 0.0008) * 0.015;
    ctx.strokeStyle = 'rgba(99, 102, 241, ' + galpha + ')';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, viewSize); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(viewSize, i * CELL); ctx.stroke();
    }
  }

  function drawFood(t) {
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const pulse = 0.5 + Math.sin(t * 0.006) * 0.5; // 0..1
    const baseR = Math.max(3, CELL / 2 - 2);

    // 多层外光晕
    for (let layer = 3; layer >= 1; layer--) {
      const rad = baseR * (2 + layer * 1.2) + pulse * 4;
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, rad);
      g.addColorStop(0, 'rgba(251, 191, 36, ' + (0.18 + pulse * 0.15) + ')');
      g.addColorStop(1, 'rgba(251, 191, 36, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(fx, fy, rad, 0, Math.PI * 2);
      ctx.fill();
    }

    // 旋转光环
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(t * 0.002);
    ctx.strokeStyle = 'rgba(251, 191, 36, ' + (0.4 + pulse * 0.3) + ')';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, baseR + 4 + pulse * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // 食物主体（脉动）
    const r = baseR * (0.92 + pulse * 0.12);
    const grad = ctx.createRadialGradient(fx - r * 0.3, fy - r * 0.3, 0, fx, fy, r);
    grad.addColorStop(0, '#fef3c7');
    grad.addColorStop(0.5, '#fbbf24');
    grad.addColorStop(1, '#d97706');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, r, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(fx - r * 0.3, fy - r * 0.3, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTrail() {
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i];
      p.life -= 0.035;
      if (p.life <= 0) { trail.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(74, 222, 128, ' + (p.life * 0.35) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, CELL * 0.3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.93; p.vy *= 0.93;
      p.life -= 0.022;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const a = Math.max(0, p.life);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      // spark 粒子带辉光
      if (p.spark) {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 计算移动插值进度（0..1），让蛇平滑滑入下一格
  function moveProgress(now) {
    if (!currentInterval) return 1;
    const p = (now - lastStepAt) / currentInterval;
    return Math.min(1, Math.max(0, p));
  }

  function drawSnake(t) {
    if (!snake || snake.length === 0) return;
    const now = performance.now();
    const prog = running && !paused ? moveProgress(now) : 1;
    const pad = Math.max(1.5, CELL * 0.08);
    const r = Math.max(3, CELL * 0.32);

    // 统一插值：每段从自己的前一段位置滑出，转弯时不闪
    const pts = [];
    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      if (i === 0) {
        pts.push({
          x: lerp(prevHead.x, s.x, prog),
          y: lerp(prevHead.y, s.y, prog)
        });
      } else {
        const prev = snake[i - 1];
        pts.push({
          x: lerp(prev.x, s.x, prog),
          y: lerp(prev.y, s.y, prog)
        });
      }
    }

    // 死亡闪烁：用平滑的 sin 而非硬切换
    let alphaMul = 1;
    if (deathFlash > 0) {
      alphaMul = 0.55 + 0.45 * Math.sin(t * 0.012);
    }

    // 先整体设置发光，避免每段开关阴影导致的渲染差异
    ctx.save();
    ctx.shadowColor = 'rgba(74, 222, 128, 0.55)';
    ctx.shadowBlur = 12;

    // 从尾到头绘制
    for (let i = snake.length - 1; i >= 0; i--) {
      const p = pts[i];
      const px = p.x * CELL;
      const py = p.y * CELL;
      const ratio = i / Math.max(1, snake.length - 1);
      const hue = 150 + ratio * 25;
      const light = 62 - ratio * 26;
      ctx.fillStyle = 'hsla(' + hue + ', 72%, ' + light + '%, ' + alphaMul + ')';
      roundRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, r);
      ctx.fill();
    }
    ctx.restore();

    // 顶部高光（无阴影，稳定叠加）
    ctx.save();
    ctx.globalAlpha = 0.22 * alphaMul;
    ctx.fillStyle = '#ffffff';
    for (let i = snake.length - 1; i >= 0; i--) {
      const p = pts[i];
      const px = p.x * CELL;
      const py = p.y * CELL;
      roundRect(px + pad + 1, py + pad + 1, CELL - pad * 2 - 2, (CELL - pad * 2) * 0.32, r * 0.55);
      ctx.fill();
    }
    ctx.restore();

    // 蛇头：稳定光晕 + 眼睛
    const head = pts[0];
    const ex = head.x * CELL + CELL / 2;
    const ey = head.y * CELL + CELL / 2;
    const hg = ctx.createRadialGradient(ex, ey, 0, ex, ey, CELL * 1.35);
    hg.addColorStop(0, 'rgba(74, 222, 128, 0.35)');
    hg.addColorStop(1, 'rgba(74, 222, 128, 0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(ex, ey, CELL * 1.35, 0, Math.PI * 2);
    ctx.fill();

    const off = CELL * 0.22;
    const er = Math.max(1.2, CELL * 0.11);
    let e1, e2;
    if (dir.x === 1) { e1 = [ex + off, ey - off]; e2 = [ex + off, ey + off]; }
    else if (dir.x === -1) { e1 = [ex - off, ey - off]; e2 = [ex - off, ey + off]; }
    else if (dir.y === 1) { e1 = [ex - off, ey + off]; e2 = [ex + off, ey + off]; }
    else { e1 = [ex - off, ey - off]; e2 = [ex + off, ey - off]; }
    ctx.fillStyle = '#0a0e1a';
    ctx.beginPath();
    ctx.arc(e1[0], e1[1], er, 0, Math.PI * 2);
    ctx.arc(e2[0], e2[1], er, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(e1[0] + er * 0.4, e1[1] - er * 0.4, er * 0.35, 0, Math.PI * 2);
    ctx.arc(e2[0] + er * 0.4, e2[1] - er * 0.4, er * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPauseMask() {
    if (!paused || !running) return;
    ctx.fillStyle = 'rgba(10, 14, 26, 0.55)';
    ctx.fillRect(0, 0, viewSize, viewSize);
    ctx.fillStyle = '#e6e6e6';
    ctx.font = 'bold ' + Math.floor(viewSize * 0.09) + 'px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂 停', viewSize / 2, viewSize / 2);
  }

  function render(t) {
    // 屏幕震动
    let ox = 0, oy = 0;
    if (shake > 0) {
      ox = (Math.random() - 0.5) * shake;
      oy = (Math.random() - 0.5) * shake;
      shake *= 0.86;
      if (shake < 0.3) shake = 0;
    }
    if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - 0.015);

    ctx.save();
    ctx.translate(ox, oy);
    drawBackground(t);
    drawTrail();
    drawFood(t);
    drawSnake(t);
    drawParticles();
    drawPauseMask();
    ctx.restore();

    requestAnimationFrame(render);
  }

  // ===== 游戏循环 =====
  function loopStep() {
    step();
    const speed = Math.max(70, 150 - Math.floor(score / 50) * 10);
    if (speed !== currentInterval) {
      currentInterval = speed;
      clearInterval(timer);
      timer = setInterval(loopStep, speed);
    }
  }

  function start() {
    init();
    resize();
    running = true;
    paused = false;
    currentInterval = 150;
    lastStepAt = performance.now();
    overlay.classList.remove('over');
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(loopStep, currentInterval);
  }

  function setDir(x, y) {
    if (!running) return;
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  function dirByName(name) {
    if (name === 'up') setDir(0, -1);
    else if (name === 'down') setDir(0, 1);
    else if (name === 'left') setDir(-1, 0);
    else if (name === 'right') setDir(1, 0);
  }

  // D-pad：触摸即响应
  dpad.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.target.closest('button[data-dir]');
    if (t) dirByName(t.dataset.dir);
  }, { passive: false });
  dpad.addEventListener('click', function (e) {
    const t = e.target.closest('button[data-dir]');
    if (t) dirByName(t.dataset.dir);
  });

  // 画布滑动控制
  let ts = null;
  canvas.addEventListener('touchstart', function (e) {
    ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (!ts) return;
    const dx = e.changedTouches[0].clientX - ts.x;
    const dy = e.changedTouches[0].clientY - ts.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 18) dirByName(dx > 0 ? 'right' : 'left');
    } else {
      if (Math.abs(dy) > 18) dirByName(dy > 0 ? 'down' : 'up');
    }
    ts = null;
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { e.preventDefault(); dirByName('up'); }
    else if (k === 'arrowdown' || k === 's') { e.preventDefault(); dirByName('down'); }
    else if (k === 'arrowleft' || k === 'a') { e.preventDefault(); dirByName('left'); }
    else if (k === 'arrowright' || k === 'd') { e.preventDefault(); dirByName('right'); }
    else if (e.key === ' ') { e.preventDefault(); if (running) { paused = !paused; } }
  });

  pauseBtn.addEventListener('click', function () { if (running) paused = !paused; });
  startBtn.addEventListener('click', start);

  window.addEventListener('resize', function () { resize(); initStars(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { resize(); initStars(); }, 200); });

  init();
  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
