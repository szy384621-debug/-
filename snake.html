<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="贪吃蛇">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3460">
<meta name="format-detection" content="telephone=no">
<title>贪吃蛇</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f3460 100%);
    color: #e6e6e6;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    width: 100%;
    max-width: 560px;
    padding: 14px 18px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title {
    font-size: 1.35rem;
    font-weight: 700;
    background: linear-gradient(90deg, #4ade80, #22d3ee, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .stats { display: flex; gap: 8px; }
  .chip {
    font-size: 0.75rem;
    padding: 5px 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    white-space: nowrap;
  }
  .chip b { color: #4ade80; }

  .stage {
    flex: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 12px;
    min-height: 0;
  }
  .wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #0a0e1a;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,14,26,0.9);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    transition: opacity 0.25s;
  }
  .overlay h2 {
    font-size: 1.6rem;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .over h2 { background: linear-gradient(90deg, #f87171, #fbbf24); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .overlay p { color: #94a3b8; font-size: 0.85rem; line-height: 1.7; }
  .final { color: #4ade80; font-size: 1.1rem; font-weight: 600; }
  button.btn {
    padding: 12px 34px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    color: #0a0e1a;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 6px 20px rgba(74,222,128,0.35);
    cursor: pointer;
  }
  .hidden { opacity: 0; pointer-events: none; }

  .controls {
    width: 100%;
    max-width: 560px;
    padding: 10px 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .dpad {
    position: relative;
    width: 150px;
    height: 150px;
    flex: 0 0 auto;
  }
  .dpad button {
    position: absolute;
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e6e6e6;
    font-size: 1.3rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .dpad button:active { background: rgba(74,222,128,0.35); }
  .dpad .up    { top: 0; left: 50px; }
  .dpad .left  { top: 50px; left: 0; }
  .dpad .right { top: 50px; left: 100px; }
  .dpad .down  { top: 100px; left: 50px; }
  .dpad .center { top: 50px; left: 50px; width: 50px; height: 50px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.08); }

  .side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    flex: 1;
  }
  .action {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e6e6e6;
    font-size: 0.95rem;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .action:active { background: rgba(74,222,128,0.25); }
  .tip { font-size: 0.72rem; color: #64748b; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <div class="title">贪 吃 蛇</div>
    <div class="stats">
      <span class="chip">分 <b id="score">0</b></span>
      <span class="chip">最高 <b id="best">0</b></span>
    </div>
  </header>

  <div class="stage">
    <div class="wrap">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <h2>准备好了吗？</h2>
        <p>滑动屏幕或点击方向键控制<br>吃到食物得分，撞墙或自身结束</p>
        <button class="btn" id="startBtn">开 始 游 戏</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" id="dpad">
      <button class="up"    data-dir="up">▲</button>
      <button class="left"  data-dir="left">◀</button>
      <span class="center"></span>
      <button class="right" data-dir="right">▶</button>
      <button class="down"  data-dir="down">▼</button>
    </div>
    <div class="side">
      <button class="action" id="pauseBtn">暂 停</button>
      <div class="tip">滑动画面 / 点击方向键<br>空格键暂停</div>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const dpad = document.getElementById('dpad');

  const COLS = 20, ROWS = 20;
  let CELL = 20;

  let snake, dir, nextDir, food, score, best, running, paused, timer, particles, currentInterval;

  best = +localStorage.getItem('snake_best') || 0;
  bestEl.textContent = best;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const size = Math.max(1, Math.floor(Math.min(rect.width, rect.height)));
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CELL = size / COLS;
    draw();
  }

  function init() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    particles = [];
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function step() {
    if (paused || !running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnParticles(food.x, food.y);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function spawnParticles(gx, gy) {
    const cx = gx * CELL + CELL / 2;
    const cy = gy * CELL + CELL / 2;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 });
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life -= 0.04;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(251, 191, 36, ' + p.life + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    const size = Math.min(rect.width, rect.height);
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, size, size);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(size, i * CELL); ctx.stroke();
    }

    // 食物
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, CELL * 1.5);
    glow.addColorStop(0, 'rgba(251, 191, 36, 0.6)');
    glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(food.x * CELL - CELL, food.y * CELL - CELL, CELL * 3, CELL * 3);
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(fx, fy, Math.max(2, CELL / 2 - 3), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.arc(fx - 2, fy - 2, Math.max(1, CELL / 5), 0, Math.PI * 2);
    ctx.fill();

    // 蛇
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / snake.length;
      const r = Math.round(74 + (34 - 74) * t);
      const g = Math.round(222 + (211 - 222) * t);
      const b = Math.round(128 + (238 - 128) * t);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, Math.max(2, CELL / 4));
      ctx.fill();
      if (i === 0) {
        ctx.fillStyle = '#0a0e1a';
        const ex = s.x * CELL + CELL / 2;
        const ey = s.y * CELL + CELL / 2;
        const off = CELL / 5;
        let e1, e2;
        if (dir.x === 1) { e1 = [ex + 2, ey - off]; e2 = [ex + 2, ey + off]; }
        else if (dir.x === -1) { e1 = [ex - 2, ey - off]; e2 = [ex - 2, ey + off]; }
        else if (dir.y === 1) { e1 = [ex - off, ey + 2]; e2 = [ex + off, ey + 2]; }
        else { e1 = [ex - off, ey - 2]; e2 = [ex + off, ey - 2]; }
        ctx.beginPath();
        ctx.arc(e1[0], e1[1], Math.max(1, CELL / 9), 0, Math.PI * 2);
        ctx.arc(e2[0], e2[1], Math.max(1, CELL / 9), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    drawParticles();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    overlay.classList.add('over');
    overlay.classList.remove('hidden');
    overlay.innerHTML =
      '<h2>游戏结束</h2>' +
      '<p class="final">本局得分 ' + score + '</p>' +
      '<p>最高分 ' + best + '</p>' +
      '<button class="btn" id="restartBtn">再 来 一 局</button>';
    document.getElementById('restartBtn').addEventListener('click', start);
  }

  function loopStep() {
    step();
    const speed = Math.max(70, 150 - Math.floor(score / 50) * 10);
    if (speed !== currentInterval) {
      currentInterval = speed;
      clearInterval(timer);
      timer = setInterval(loopStep, speed);
    }
  }

  function start() {
    init();
    running = true;
    paused = false;
    currentInterval = 150;
    overlay.classList.remove('over');
    overlay.classList.add('hidden');
    resize();
    draw();
    clearInterval(timer);
    timer = setInterval(loopStep, currentInterval);
  }

  function setDir(x, y) {
    if (!running) return;
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  function dirByName(name) {
    if (name === 'up') setDir(0, -1);
    else if (name === 'down') setDir(0, 1);
    else if (name === 'left') setDir(-1, 0);
    else if (name === 'right') setDir(1, 0);
  }

  // D-pad：触摸即响应，支持手指滑动连续触发
  dpad.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.target.closest('button[data-dir]');
    if (t) dirByName(t.dataset.dir);
  }, { passive: false });
  dpad.addEventListener('click', function (e) {
    const t = e.target.closest('button[data-dir]');
    if (t) dirByName(t.dataset.dir);
  });

  // 画布滑动控制
  let ts = null;
  canvas.addEventListener('touchstart', function (e) {
    ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (!ts) return;
    const dx = e.changedTouches[0].clientX - ts.x;
    const dy = e.changedTouches[0].clientY - ts.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 18) dirByName(dx > 0 ? 'right' : 'left');
    } else {
      if (Math.abs(dy) > 18) dirByName(dy > 0 ? 'down' : 'up');
    }
    ts = null;
  }, { passive: true });

  // 键盘（桌面兼容）
  document.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { e.preventDefault(); dirByName('up'); }
    else if (k === 'arrowdown' || k === 's') { e.preventDefault(); dirByName('down'); }
    else if (k === 'arrowleft' || k === 'a') { e.preventDefault(); dirByName('left'); }
    else if (k === 'arrowright' || k === 'd') { e.preventDefault(); dirByName('right'); }
    else if (e.key === ' ') { e.preventDefault(); if (running) { paused = !paused; } }
  });

  pauseBtn.addEventListener('click', function () { if (running) paused = !paused; });
  startBtn.addEventListener('click', start);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  init();
  resize();
  draw();
})();
</script>
</body>
</html>
